name: Supabase keep-alive

# Le tier gratuit Supabase met le projet EN PAUSE après 7 jours d'inactivité.
# Ce job envoie une requête minuscule tous les 3 jours pour le garder actif.
# (Une fois en pause, l'app ne peut PAS le réveiller : il faut "Restore" sur le
# dashboard. Ce cron PRÉVIENT la mise en pause.)
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   SUPABASE_URL       ex. https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  la clé "anon public"

on:
  schedule:
    - cron: '17 6 */3 * *' # toutes les ~72 h (heure décalée pour éviter le pic)
  workflow_dispatch: {}     # bouton "Run workflow" pour tester à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY manquants."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/cards?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          # 2xx = OK. On échoue si le projet est injoignable (utile comme alerte).
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Supabase a répondu $code (projet en pause ?)."
            exit 1
          fi
          echo "Supabase actif ✅"
