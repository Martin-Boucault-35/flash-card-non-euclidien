name: CI

# Analyse statique + tests. Se lance sur chaque PR (et sur main après merge).
#
# Astuce "docs = rapide" : le job tourne TOUJOURS (pour que le check requis `test`
# soit bien rapporté et ne bloque pas la PR), mais les étapes lourdes (Flutter)
# ne s'exécutent QUE s'il y a un vrai changement de code. Une PR de doc passe
# donc au vert en quelques secondes.

on:
  pull_request:
  push:
    branches: [main]

# dorny/paths-filter interroge l'API GitHub pour lister les fichiers d'une PR :
# il lui faut ce droit en lecture (sinon "Resource not accessible by integration").
permissions:
  contents: read
  pull-requests: read

# Sur une PR, un nouveau push annule le run précédent (inutile de tester un
# commit déjà remplacé). Sur `main`, JAMAIS d'annulation : chaque commit de la
# branche de prod doit être validé jusqu'au bout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Détecter les changements de code
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'Polymnesis_flutter/**'
              - '.github/workflows/**'

      - name: Setup Java
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: steps.changes.outputs.code == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7 # = version locale, builds reproductibles
          cache: true

      - name: Dépendances
        if: steps.changes.outputs.code == 'true'
        working-directory: Polymnesis_flutter
        run: flutter pub get

      - name: Analyze
        if: steps.changes.outputs.code == 'true'
        working-directory: Polymnesis_flutter
        run: flutter analyze

      - name: Tests
        if: steps.changes.outputs.code == 'true'
        working-directory: Polymnesis_flutter
        run: flutter test

      - name: Rien à tester (changement doc uniquement)
        if: steps.changes.outputs.code != 'true'
        run: echo "Pas de changement de code → analyse/tests sautés. ✅"
